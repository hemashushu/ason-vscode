name: Test and Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:web
        timeout-minutes: 15
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
        timeout-minutes: 15
      - if: runner.os != 'Linux'
        run: npm run test:desktop
        timeout-minutes: 15
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: ason-vscode-${{ runner.os }}
          path: ason-vscode.vsix