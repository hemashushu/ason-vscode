name: Publish to VS Code Marketplace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:web
      - run: xvfb-run -a npm run test:desktop
      - name: Publish with GitHub Actions Trusted Publishing
        run: npx @vscode/vsce publish --oidc
